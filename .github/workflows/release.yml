name: SDK CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Validate SDK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Format package sources
        run: dart format --output=none --set-exit-if-changed lib
      - name: Analyze package
        run: flutter analyze lib
      - name: Test package when tests exist
        run: |
          if [ -d test ]; then
            flutter test
          else
            echo "No test directory found; skipping tests."
          fi
