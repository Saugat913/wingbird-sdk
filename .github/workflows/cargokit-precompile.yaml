name: Flutter SDK CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check Flutter package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      # Cargokit contains a vendored build tool with its own Dart SDK
      # compatibility requirements. It is not part of this package's public
      # Dart library and is intentionally excluded from package formatting.
      - name: Format package sources
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze package
        run: flutter analyze lib test
      - name: Test package
        run: flutter test
